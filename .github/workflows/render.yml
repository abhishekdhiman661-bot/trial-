name: Render 3D Short

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libglu1-mesa libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libgl1 xvfb

      - name: Download and Install Blender
        run: |
          echo "Downloading Blender 4.2 LTS..."
          curl -fSL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_DIR=$(find . -maxdepth 1 -name "blender-*-linux-*" -type d | head -n 1)
          echo "$PWD/$BLENDER_DIR" >> $GITHUB_PATH
          echo "Blender successfully installed."

      - name: Build 3D Scenes in Blender
        run: |
          xvfb-run -a blender -b -P build_scenes.py

      - name: Render All 8 Scenes with Blender
        run: |
          mkdir -p renders
          xvfb-run -a blender -b brain_myth.blend -P render_all.py

      - name: Prepare Assets for Video Assembly
        run: |
          mkdir -p edit/assets
          cp renders/*.mp4 edit/assets/ 2>/dev/null || true
          cp audio/vo.wav edit/assets/
          python3 assemble.py

      - name: Combine Rendered Scenes with Voiceover (ffmpeg)
        run: |
          cat << 'EOF' > concat_list.txt
          file 'renders/scene_01.mp4'
          file 'renders/scene_02.mp4'
          file 'renders/scene_03.mp4'
          file 'renders/scene_04.mp4'
          file 'renders/scene_05.mp4'
          file 'renders/scene_06.mp4'
          file 'renders/scene_07.mp4'
          file 'renders/scene_08.mp4'
          EOF

          ffmpeg -f concat -safe 0 -i concat_list.txt -i audio/vo.wav \
            -vf "subtitles=captions.srt:force_style='FontName=Montserrat,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Alignment=2,MarginV=120,Bold=1'" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -y final_short.mp4 || \
          ffmpeg -f concat -safe 0 -i concat_list.txt -i audio/vo.wav -c:v copy -c:a aac -shortest -y final_short.mp4

      - name: Attempt HyperFrames Studio Render
        continue-on-error: true
        run: |
          cd edit
          npx --yes hyperframes@0.9.37 render -o ../hyperframes_render.mp4 || true

      - name: Upload Final Video & Render Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-short-video
          path: |
            final_short.mp4
            hyperframes_render.mp4
            brain_myth.blend
            renders/*.mp4
